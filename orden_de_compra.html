<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechnoMaQ - Orden de Compra</title>
  <style>
    :root {
      --primary: #ef6c00;
      --primary-dark: #d95a00;
      --primary-soft: #fff4eb;
      --bg: #f6f6f6;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #666666;
      --line: #e8e8e8;
      --success: #1f8f4f;
      --shadow: 0 12px 28px rgba(17, 17, 17, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      height: 12px;
      background: var(--primary);
    }

    .page {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 18px 40px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 24px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.1;
      color: var(--text);
    }

    .brand small {
      display: block;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 4px;
      font-size: 0.72rem;
    }

    .header-meta {
      text-align: right;
    }

    .header-meta .label {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-meta strong {
      display: block;
      margin-top: 10px;
      font-size: 1.05rem;
      color: var(--text);
    }

    .panel {
      margin-top: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(239, 108, 0, 0.12);
    }

    .field textarea {
      min-height: 94px;
      resize: vertical;
    }

    .table-wrap {
      margin-top: 22px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #fafafa;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text);
    }

    td input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
    }

    .money {
      text-align: right;
      font-weight: 700;
      color: var(--text);
    }

    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.92rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: var(--text);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: #d9534f;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.8rem;
    }

    .totals {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 0.96rem;
    }

    .total-box {
      min-width: 220px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      background: #fcfcfc;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .total-box strong {
      font-size: 0.9rem;
    }

    .total-box span {
      font-weight: 700;
      color: var(--text);
    }

    .total-final {
      background: var(--primary-soft);
      border-color: rgba(239, 108, 0, 0.2);
    }

    .muted {
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .actions-row {
        align-items: stretch;
      }

      .btn-row {
        width: 100%;
      }

      .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="topbar"></div>

  <div class="page">
    <header class="header">
      <div class="brand">
        <img src="LogoT.png" alt="TechnoMaQ" />
        <div>
          <h1>TechnoMaQ</h1>
          <small>ORDEN DE COMPRA</small>
        </div>
      </div>
      <div class="header-meta">
        <span class="label">Documento</span>
        <strong>Compra / Proveedor</strong>
      </div>
    </header>

    <main class="panel">
      <form id="formOrdenCompra">
        <div class="form-grid">
          <div class="field">
            <label for="ordenFolio">Folio</label>
            <input id="ordenFolio" type="text" value="OC-0001" />
          </div>
          <div class="field">
            <label for="ordenFecha">Fecha</label>
            <input id="ordenFecha" type="date" />
          </div>
          <div class="field">
            <label for="ordenProveedor">Proveedor</label>
            <input id="ordenProveedor" type="text" placeholder="Nombre del proveedor" />
          </div>
          <div class="field">
            <label for="ordenContacto">Contacto</label>
            <input id="ordenContacto" type="text" placeholder="Nombre del contacto" />
          </div>
          <div class="field">
            <label for="ordenTelefono">Teléfono</label>
            <input id="ordenTelefono" type="tel" placeholder="Ej. +52 311 123 4567" />
          </div>
          <div class="field">
            <label for="ordenCorreo">Correo</label>
            <input id="ordenCorreo" type="email" placeholder="correo@proveedor.com" />
          </div>
          <div class="field">
            <label for="ordenMetodoPago">Método de pago</label>
            <select id="ordenMetodoPago">
              <option>Transferencia</option>
              <option>Efectivo</option>
              <option>Tarjeta</option>
              <option>Crédito</option>
            </select>
          </div>
          <div class="field">
            <label for="ordenEntrega">Entrega</label>
            <input id="ordenEntrega" type="text" placeholder="Ej. Domicilio / Planta" />
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label for="ordenNotas">Notas</label>
            <textarea id="ordenNotas" placeholder="Agregar comentarios o condiciones de entrega..."></textarea>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Descripción</th>
                <th style="width:120px;">Cantidad</th>
                <th style="width:160px;">Precio unitario</th>
                <th style="width:150px;">Importe</th>
                <th style="width:90px;"></th>
              </tr>
            </thead>
            <tbody id="ordenItemsBody">
              <tr>
                <td><input type="text" class="orden-desc" placeholder="Descripción del producto o servicio" /></td>
                <td><input type="number" class="orden-cant" value="1" min="1" /></td>
                <td><input type="number" class="orden-precio" value="0" min="0" step="0.01" /></td>
                <td class="money orden-total">$0.00</td>
                <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove(); calcularTotalesOrden();">Eliminar</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="actions-row">
          <div class="btn-row">
            <button type="button" class="btn btn-secondary" onclick="agregarFilaOrden()">Agregar artículo</button>
            <button type="button" class="btn btn-primary" onclick="previewOrdenCompra()">Previsualizar</button>
            <button type="button" class="btn btn-primary" onclick="imprimirOrdenCompra()">Imprimir</button>
            <button type="button" class="btn btn-success" id="btnDescargarOrden" onclick="descargarOrdenCompraPDF()">Descargar PDF</button>
          </div>
          <div class="muted">Moneda: MXN</div>
        </div>

        <div class="totals">
          <div class="total-box">
            <strong>Subtotal</strong>
            <span id="ordenSubtotal">$0.00</span>
          </div>
          <div class="total-box">
            <strong>IVA 16%</strong>
            <span id="ordenIva">$0.00</span>
          </div>
          <div class="total-box total-final">
            <strong>Total</strong>
            <span id="ordenTotal">$0.00</span>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    function formatMoney(value) {
      return '$' + Number(value || 0).toFixed(2);
    }

    function calcularTotalesOrden() {
      const rows = document.querySelectorAll('#ordenItemsBody tr');
      let subtotal = 0;

      rows.forEach(row => {
        const cantidad = parseFloat(row.querySelector('.orden-cant')?.value || 0);
        const precio = parseFloat(row.querySelector('.orden-precio')?.value || 0);
        const total = cantidad * precio;
        const cell = row.querySelector('.orden-total');
        if (cell) cell.textContent = formatMoney(total);
        subtotal += total;
      });

      const iva = subtotal * 0.16;
      const total = subtotal + iva;

      document.getElementById('ordenSubtotal').textContent = formatMoney(subtotal);
      document.getElementById('ordenIva').textContent = formatMoney(iva);
      document.getElementById('ordenTotal').textContent = formatMoney(total);
    }

    document.addEventListener('input', function () {
      calcularTotalesOrden();
    });

    function agregarFilaOrden() {
      const tbody = document.getElementById('ordenItemsBody');
      if (!tbody) return;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td><input type="text" class="orden-desc" placeholder="Descripción del producto o servicio" /></td>
        <td><input type="number" class="orden-cant" value="1" min="1" /></td>
        <td><input type="number" class="orden-precio" value="0" min="0" step="0.01" /></td>
        <td class="money orden-total">$0.00</td>
        <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove(); calcularTotalesOrden();">Eliminar</button></td>
      `;
      tbody.appendChild(row);
      calcularTotalesOrden();
    }

    function buildOrdenCompraHTML() {
      const folio = document.getElementById('ordenFolio')?.value || 'OC-0001';
      const fecha = document.getElementById('ordenFecha')?.value || new Date().toISOString().slice(0, 10);
      const proveedor = document.getElementById('ordenProveedor')?.value || 'Proveedor';
      const contacto = document.getElementById('ordenContacto')?.value || '---';
      const telefono = document.getElementById('ordenTelefono')?.value || '---';
      const correo = document.getElementById('ordenCorreo')?.value || '---';
      const metodoPago = document.getElementById('ordenMetodoPago')?.value || 'Transferencia';
      const entrega = document.getElementById('ordenEntrega')?.value || 'Sin especificar';
      const notas = document.getElementById('ordenNotas')?.value || 'Sin observaciones';

      const rows = document.querySelectorAll('#ordenItemsBody tr');
      let itemsHtml = '';
      let subtotal = 0;

      rows.forEach((row, index) => {
        const desc = row.querySelector('.orden-desc')?.value || 'Sin descripción';
        const cantidad = parseFloat(row.querySelector('.orden-cant')?.value || 0);
        const precio = parseFloat(row.querySelector('.orden-precio')?.value || 0);
        const total = cantidad * precio;
        subtotal += total;

        itemsHtml += `
          <tr>
            <td style="padding:10px 8px; border:1px solid #ececec;">${index + 1}</td>
            <td style="padding:10px 8px; border:1px solid #ececec;">${desc}</td>
            <td style="padding:10px 8px; border:1px solid #ececec; text-align:center;">${cantidad}</td>
            <td style="padding:10px 8px; border:1px solid #ececec; text-align:right;">${formatMoney(precio)}</td>
            <td style="padding:10px 8px; border:1px solid #ececec; text-align:right;">${formatMoney(total)}</td>
          </tr>
        `;
      });

      const iva = subtotal * 0.16;
      const total = subtotal + iva;

      return `
        <!doctype html>
        <html lang="es">
        <head>
          <meta charset="UTF-8" />
          <title>Orden de compra ${folio}</title>
          <style>
            * { box-sizing: border-box; }
            body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#fff; color:#1f1f1f; }
            .page { max-width: 860px; margin: 0 auto; padding: 24px 28px 18px; }
            .header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:4px solid #ef6c00; padding-bottom:14px; margin-bottom:18px; }
            .brand { display:flex; align-items:center; gap:12px; }
            .brand img { width:58px; height:58px; object-fit:contain; }
            .brand h1 { margin:0; font-size: 28px; }
            .brand small { display:block; color:#666; letter-spacing:1px; font-size:11px; }
            .meta { text-align:right; }
            .meta .tag { background:#ef6c00; color:#fff; display:inline-block; padding:6px 12px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.08em; }
            .meta .folio { font-size: 22px; font-weight:700; color:#1f1f1f; margin-top:10px; }
            .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:18px; }
            .box { border:1px solid #eaeaea; background:#f9f9f9; border-radius:10px; padding:12px 14px; }
            .box h3 { margin:0 0 10px; font-size:13px; text-transform: uppercase; letter-spacing:0.05em; color:#333; }
            .box p { margin: 6px 0; font-size: 12px; line-height: 1.5; }
            table { width:100%; border-collapse: collapse; margin-top: 8px; }
            th { background:#111; color:#fff; font-size:12px; text-transform: uppercase; padding:9px 8px; }
            td { padding:10px 8px; border:1px solid #ececec; font-size:12px; }
            .totals { margin-top:16px; width: 290px; margin-left:auto; }
            .totals table { width:100%; }
            .totals td { border:none; padding:8px 10px; background:#fafafa; }
            .totals .total-row td { background:#ef6c00; color:#fff; font-weight:700; }
            .notes { margin-top:18px; border-top:1px solid #eaeaea; padding-top:12px; font-size:12px; line-height:1.6; }
            .footer { margin-top:20px; border-top: 2px solid #ef6c00; padding-top:12px; font-size:11px; color:#666; text-align:center; }
          </style>
        </head>
        <body>
          <div class="page">
            <div class="header">
              <div class="brand">
                <img src="LogoT.png" alt="TechnoMaQ" />
                <div>
                  <h1>TechnoMaQ</h1>
                  <small>SOLUTIONS</small>
                </div>
              </div>
              <div class="meta">
                <div class="tag">Orden de compra</div>
                <div class="folio">${folio}</div>
                <div style="font-size:12px; margin-top:6px; color:#666;">Fecha: ${fecha}</div>
              </div>
            </div>

            <div class="grid">
              <div class="box">
                <h3>Proveedor</h3>
                <p><strong>Nombre:</strong> ${proveedor}</p>
                <p><strong>Contacto:</strong> ${contacto}</p>
                <p><strong>Teléfono:</strong> ${telefono}</p>
                <p><strong>Correo:</strong> ${correo}</p>
              </div>
              <div class="box">
                <h3>Datos de la compra</h3>
                <p><strong>Método de pago:</strong> ${metodoPago}</p>
                <p><strong>Entrega:</strong> ${entrega}</p>
                <p><strong>Moneda:</strong> MXN</p>
              </div>
            </div>

            <table>
              <thead>
                <tr>
                  <th style="width:50px;">#</th>
                  <th>Descripción</th>
                  <th style="width:120px; text-align:center;">Cantidad</th>
                  <th style="width:140px; text-align:right;">Precio unitario</th>
                  <th style="width:140px; text-align:right;">Importe</th>
                </tr>
              </thead>
              <tbody>
                ${itemsHtml}
              </tbody>
            </table>

            <div class="totals">
              <table>
                <tr>
                  <td>Subtotal</td>
                  <td style="text-align:right;">${formatMoney(subtotal)}</td>
                </tr>
                <tr>
                  <td>IVA 16%</td>
                  <td style="text-align:right;">${formatMoney(iva)}</td>
                </tr>
                <tr class="total-row">
                  <td>Total</td>
                  <td style="text-align:right;">${formatMoney(total)}</td>
                </tr>
              </table>
            </div>

            <div class="notes">
              <strong>Notas:</strong><br />
              ${notas.replace(/\n/g, '<br />')}
            </div>

            <div class="footer">
              TECHNOMAQ SOLUCIONES · Av. de los Insurgentes oriente No. 2137, Col. Llanitos, Tepic, Nayarit<br />
              Tel. 311 489 9474 / 331 538 0857 · administracion@technomaq.mx
            </div>
          </div>
        </body>
        </html>
      `;
    }

    function previewOrdenCompra() {
      const html = buildOrdenCompraHTML();
      const win = window.open('', '_blank');
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.focus();
    }

    function imprimirOrdenCompra() {
      const html = buildOrdenCompraHTML();
      const win = window.open('', '_blank');
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.focus();
      setTimeout(() => win.print(), 500);
    }

    function descargarOrdenCompraPDF() {
      const btn = document.getElementById('btnDescargarOrden');
      if (btn && btn.disabled) return;

      if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
        alert('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta otra vez.');
        return;
      }

      const fallbackText = btn ? btn.textContent : 'Descargar PDF';
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Generando...';
      }

      const folio = document.getElementById('ordenFolio')?.value || 'OC-0001';
      const temp = document.createElement('div');
      temp.innerHTML = buildOrdenCompraHTML();
      temp.style.position = 'fixed';
      temp.style.left = '0';
      temp.style.top = '0';
      temp.style.width = '860px';
      temp.style.background = '#fff';
      temp.style.zIndex = '-1';
      temp.style.pointerEvents = 'none';
      document.body.appendChild(temp);

      const clean = () => {
        if (document.body.contains(temp)) document.body.removeChild(temp);
        if (btn) {
          btn.disabled = false;
          btn.textContent = fallbackText;
        }
      };

      setTimeout(() => {
        html2canvas(temp, {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#ffffff'
        }).then(canvas => {
          try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'mm', format: 'letter', orientation: 'portrait' });
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const imgWidth = pageWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            const imgData = canvas.toDataURL('image/png');

            let heightLeft = imgHeight;
            let position = 0;

            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;

            while (heightLeft > 0) {
              position = heightLeft - imgHeight;
              pdf.addPage();
              pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
              heightLeft -= pageHeight;
            }

            pdf.save('OrdenCompra_' + folio + '.pdf');
            clean();
          } catch (err) {
            clean();
            alert('Ocurrió un error al generar el PDF: ' + err.message);
          }
        }).catch(err => {
          clean();
          alert('Ocurrió un error al generar el PDF. Intenta de nuevo.');
        });
      }, 200);
    }

    document.addEventListener('DOMContentLoaded', function () {
      const fecha = document.getElementById('ordenFecha');
      if (fecha && !fecha.value) fecha.value = new Date().toISOString().slice(0, 10);
      calcularTotalesOrden();
    });
  </script>
</body>
</html>
